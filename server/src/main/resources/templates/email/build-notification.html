<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zovik Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #e4e4e7; -webkit-font-smoothing: antialiased;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #09090b; padding: 48px 16px;">
        <tr>
            <td align="center">
                
                <!-- Email Card Container -->
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 460px; background-color: #121215; border: 1px solid #222226; border-radius: 12px; overflow: hidden; text-align: left;">
                    
                    <!-- Content Body -->
                    <tr>
                        <td style="padding: 32px 32px 28px 32px;">
                            
                            <!-- Mini Brand Mark Header -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 24px;">
                                <tr>
                                    <td valign="middle">
                                        <div style="display: inline-block; vertical-align: middle;">
                                            <span style="display: inline-block; width: 18px; height: 18px; line-height: 18px; background-color: #7C3AED; color: #ffffff; font-weight: 900; font-size: 11px; text-align: center; border-radius: 4px; font-family: monospace;">Z</span>
                                            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #71717a; margin-left: 8px; text-transform: uppercase;">ZOVIK CI/CD</span>
                                        </div>
                                    </td>
                                    <td align="right" valign="middle">
                                        <!-- Status Indicator Pill -->
                                        <span th:if="${status == 'SUCCESS'}" style="display: inline-block; font-size: 12px; font-weight: 600; color: #10B981; background-color: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); padding: 3px 10px; border-radius: 20px;">
                                            ● Succeeded
                                        </span>
                                        <span th:if="${status != 'SUCCESS'}" style="display: inline-block; font-size: 12px; font-weight: 600; color: #EF4444; background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); padding: 3px 10px; border-radius: 20px;" th:text="'● ' + ${status}">
                                            ● Failed
                                        </span>
                                    </td>
                                </tr>
                            </table>

                            <!-- Build Main Title -->
                            <div style="margin-bottom: 20px;">
                                <h1 style="margin: 0 0 6px 0; font-size: 18px; font-weight: 600; color: #fafafa; letter-spacing: -0.01em;">
                                    <span th:text="${projectName}">custom-ci-server</span>
                                    <span style="color: #52525b; font-weight: 400; font-family: monospace; font-size: 15px;" th:text="'#' + ${buildId}">#1</span>
                                </h1>
                                <p style="margin: 0; font-size: 13.5px; color: #a1a1aa; line-height: 1.5;">
                                    Pipeline finished execution <span th:if="${duration != '-'}" th:text="'in ' + ${duration}">in 4s</span>.
                                </p>
                            </div>

                            <!-- Divider -->
                            <div style="height: 1px; background-color: #222226; margin-bottom: 20px;"></div>

                            <!-- Metadata List (Linear style) -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 26px; font-size: 13px;">
                                <tr>
                                    <td style="padding: 5px 0; color: #71717a; width: 90px;">Branch</td>
                                    <td style="padding: 5px 0; color: #e4e4e7; font-family: ui-monospace, monospace; font-weight: 500;" th:text="${branch}">dev</td>
                                </tr>
                                <tr>
                                    <td style="padding: 5px 0; color: #71717a;">Commit</td>
                                    <td style="padding: 5px 0; color: #a1a1aa; font-family: ui-monospace, monospace;" th:text="${commitSha}">HEAD</td>
                                </tr>
                                <tr>
                                    <td style="padding: 5px 0; color: #71717a;">Trigger</td>
                                    <td style="padding: 5px 0; color: #a1a1aa;" th:text="${triggerType}">MANUAL</td>
                                </tr>
                            </table>

                            <!-- Action Button -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td>
                                        <a th:href="${buildUrl}" style="display: block; width: 100%; box-sizing: border-box; text-align: center; background-color: #7C3AED; color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em;">
                                            Open Build in Zovik
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Subtle Footer -->
                    <tr>
                        <td style="padding: 16px 32px; background-color: #0d0d10; border-top: 1px solid #1c1c20; text-align: center;">
                            <span style="font-size: 11.5px; color: #52525b;">
                                Zovik Distributed CI/CD Engine
                            </span>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
