<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zovik Build Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0c0c0e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #fafafa;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #0c0c0e; padding: 32px 16px;">
        <tr>
            <td align="center">
                <!-- Main Email Card -->
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 540px; background-color: #18181b; border: 1px solid #27272a; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.4);">
                    
                    <!-- Top Gradient Header Accent -->
                    <tr>
                        <td height="4" th:style="${status == 'SUCCESS'} ? 'background: linear-gradient(90deg, #7C3AED, #10B981);' : 'background: linear-gradient(90deg, #7C3AED, #EF4444);'"></td>
                    </tr>

                    <!-- Brand Header -->
                    <tr>
                        <td style="padding: 24px 28px 18px 28px; border-bottom: 1px solid #27272a;">
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td>
                                        <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff;">ZOVIK</span>
                                        <span style="display: inline-block; margin-left: 8px; padding: 2px 7px; background-color: rgba(124, 58, 237, 0.18); border: 1px solid rgba(124, 58, 237, 0.35); border-radius: 5px; font-size: 11px; font-weight: 700; color: #c4b5fd; letter-spacing: 0.05em; vertical-align: middle;">CI/CD</span>
                                    </td>
                                    <td align="right">
                                        <span style="font-family: monospace; font-size: 13px; color: #71717a;" th:text="'Build #' + ${buildId}">Build #1</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 28px;">
                            
                            <!-- Status Headline & Badge -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 22px;">
                                <tr>
                                    <td>
                                        <div style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #a1a1aa; margin-bottom: 6px; font-weight: 600;">Pipeline Execution</div>
                                        <div style="font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;" th:text="${projectName}">custom-ci-server</div>
                                    </td>
                                    <td align="right" valign="top">
                                        <!-- Success Badge -->
                                        <span th:if="${status == 'SUCCESS'}" style="display: inline-block; padding: 5px 12px; background-color: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 20px; font-size: 12px; font-weight: 700; color: #34d399; letter-spacing: 0.03em;">
                                            SUCCESS
                                        </span>
                                        <!-- Failure Badge -->
                                        <span th:if="${status != 'SUCCESS'}" style="display: inline-block; padding: 5px 12px; background-color: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 20px; font-size: 12px; font-weight: 700; color: #f87171; letter-spacing: 0.03em;" th:text="${status}">
                                            FAILURE
                                        </span>
                                    </td>
                                </tr>
                            </table>

                            <!-- Bento Info Matrix -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #121215; border: 1px solid #27272a; border-radius: 10px; margin-bottom: 24px; padding: 14px 18px;">
                                <tr>
                                    <td width="50%" style="padding: 6px 0;">
                                        <span style="font-size: 12px; color: #71717a; display: block; margin-bottom: 2px;">Branch</span>
                                        <span style="font-size: 13.5px; font-weight: 600; color: #e4e4e7; font-family: monospace;" th:text="${branch}">dev</span>
                                    </td>
                                    <td width="50%" style="padding: 6px 0;">
                                        <span style="font-size: 12px; color: #71717a; display: block; margin-bottom: 2px;">Commit</span>
                                        <span style="font-size: 13.5px; font-weight: 600; color: #e4e4e7; font-family: monospace;" th:text="${commitSha}">HEAD</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td width="50%" style="padding: 6px 0;">
                                        <span style="font-size: 12px; color: #71717a; display: block; margin-bottom: 2px;">Trigger</span>
                                        <span style="font-size: 13.5px; font-weight: 600; color: #e4e4e7;" th:text="${triggerType}">WEBHOOK</span>
                                    </td>
                                    <td width="50%" style="padding: 6px 0;">
                                        <span style="font-size: 12px; color: #71717a; display: block; margin-bottom: 2px;">Duration</span>
                                        <span style="font-size: 13.5px; font-weight: 600; color: #e4e4e7;" th:text="${duration}">4s</span>
                                    </td>
                                </tr>
                            </table>

                            <!-- CTA Button -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="text-align: center;">
                                <tr>
                                    <td align="center">
                                        <a th:href="${buildUrl}" style="display: inline-block; background-color: #7C3AED; color: #ffffff; text-decoration: none; padding: 11px 26px; border-radius: 8px; font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 2px 10px rgba(124, 58, 237, 0.35);">
                                            View Pipeline &amp; Logs &rarr;
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 16px 28px; background-color: #121215; border-top: 1px solid #27272a; text-align: center;">
                            <span style="font-size: 12px; color: #71717a;">
                                Automated message from <strong>Zovik Engine</strong> • Master Server
                            </span>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
