spring:
  application:
    name: rabotyagaCI

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rabotyagaci}
    username: ${DB_USERNAME:rabotyagaci}
    password: ${DB_PASSWORD:rabotyagaci}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:user}
    password: ${SMTP_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

rabotyagaci:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3001}
  notification:
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      from: ${EMAIL_NOTIFICATIONS_FROM:rabotyaga@example.com}
  runner:
    docker-host: unix:///var/run/docker.sock
    workspace-dir: /tmp/rabotyagaci/workspaces
    default-timeout: 600 
    max-concurrent-builds: 3
    container-memory-limit: 512m
    container-cpu-limit: 1.0
    network-mode: bridge
  git:
    clone-dir: /tmp/rabotyagaci/repos
  artifacts:
    storage-dir: /var/rabotyagaci/artifacts
    retention-days: 30
  retention:
    builds-days: 30
    cron: "0 0 4 * * *" # Every day at 4:00 AM
  auth:
    enabled: false
    api-key: "super-secret-key-change-me"
  security:
    master-key: ${RABOTYAGACI_MASTER_KEY}
  github:
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
