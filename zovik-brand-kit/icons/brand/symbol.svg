<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="zovik-grad-z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="zovik-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="zovik-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#18181B" stroke="#27272A" stroke-width="2" />
  
  <!-- Subtle Internal Grid Pattern -->
  <path d="M6 30 H94 M6 50 H94 M6 70 H94 M30 6 V94 M50 6 V94 M70 6 V94" stroke="#27272A" stroke-width="0.75" stroke-dasharray="2 4" />

  <!-- DAG Connection Vertex Lines (Background) -->
  <path d="M28 28 L72 28 L28 72 L72 72" stroke="url(#zovik-grad-z)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#zovik-blur)" opacity="0.4" />
  <path d="M28 28 L72 28 L28 72 L72 72" stroke="url(#zovik-grad-z)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- DAG Graph Vertices / Nodes -->
  <!-- Top-Left Vertex Node -->
  <circle cx="28" cy="28" r="6.5" fill="#09090B" stroke="#A78BFA" stroke-width="2.5" />
  <circle cx="28" cy="28" r="2.5" fill="#A78BFA" />

  <!-- Top-Right Vertex Node -->
  <circle cx="72" cy="28" r="6.5" fill="#09090B" stroke="#8B5CF6" stroke-width="2.5" />
  <circle cx="72" cy="28" r="2.5" fill="#8B5CF6" />

  <!-- Bottom-Left Vertex Node -->
  <circle cx="28" cy="72" r="6.5" fill="#09090B" stroke="#7C3AED" stroke-width="2.5" />
  <circle cx="28" cy="72" r="2.5" fill="#7C3AED" />

  <!-- Bottom-Right Vertex Node -->
  <circle cx="72" cy="72" r="6.5" fill="#09090B" stroke="#10B981" stroke-width="2.5" />
  <circle cx="72" cy="72" r="2.5" fill="#10B981" />
</svg>
