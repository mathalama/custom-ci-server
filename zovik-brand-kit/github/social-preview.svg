<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="40%" stop-color="#111116" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="og-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#og-bg)" />

  <!-- Ambient Glow Effects -->
  <circle cx="200" cy="200" r="280" fill="#7C3AED" opacity="0.12" filter="url(#og-glow)" />
  <circle cx="1080" cy="440" r="240" fill="#10B981" opacity="0.08" filter="url(#og-glow)" />

  <!-- Grid Blueprint lines -->
  <g stroke="#1F1F24" stroke-width="1.2" opacity="0.5">
    <path d="M0 128 H1280 M0 256 H1280 M0 384 H1280 M0 512 H1280" />
    <path d="M256 0 V640 M512 0 V640 M768 0 V640 M1024 0 V640" />
  </g>

  <!-- Center Card Area (Bento Preview) -->
  <g transform="translate(140, 100)">
    <!-- Symbol Large Badge -->
    <rect width="110" height="110" rx="26" fill="#18181B" stroke="#27272A" stroke-width="2.5" />
    <path d="M32 32 L78 32 L32 78 L78 78" stroke="url(#og-brand-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="32" r="7" fill="#09090B" stroke="#A78BFA" stroke-width="2.5" />
    <circle cx="32" cy="32" r="2.5" fill="#A78BFA" />
    <circle cx="78" cy="32" r="7" fill="#09090B" stroke="#8B5CF6" stroke-width="2.5" />
    <circle cx="78" cy="32" r="2.5" fill="#8B5CF6" />
    <circle cx="32" cy="78" r="7" fill="#09090B" stroke="#7C3AED" stroke-width="2.5" />
    <circle cx="32" cy="78" r="2.5" fill="#7C3AED" />
    <circle cx="78" cy="78" r="7" fill="#09090B" stroke="#10B981" stroke-width="2.5" />
    <circle cx="78" cy="78" r="2.5" fill="#10B981" />

    <!-- Big Brand Text -->
    <text x="140" y="70" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#FAFAFA" letter-spacing="-0.04em">
      ZOVIK
    </text>

    <!-- Sub-badge -->
    <g transform="translate(380, 26)">
      <rect width="100" height="38" rx="10" fill="rgba(124, 58, 237, 0.15)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1.5" />
      <text x="50" y="25" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.08em">
        CI/CD
      </text>
    </g>

    <!-- Slogan & Features -->
    <text x="0" y="180" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#FAFAFA" letter-spacing="-0.02em">
      Distributed CI/CD &amp; DAG Pipeline Engine
    </text>

    <text x="0" y="226" font-family="'Inter', sans-serif" font-size="19" font-weight="400" fill="#A1A1AA" letter-spacing="-0.01em">
      High-performance DAG topology scheduler • Multi-cloud Go agents • Real-time STOMP telemetry
    </text>

    <!-- 3 Bento Feature Highlights -->
    <g transform="translate(0, 270)">
      <!-- Bento Item 1 -->
      <rect x="0" y="0" width="310" height="90" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="24" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">⚡️ DAG Engine</text>
      <text x="24" y="64" font-family="'Inter', sans-serif" font-size="13" fill="#A1A1AA">Cycle-free parallel task scheduler</text>

      <!-- Bento Item 2 -->
      <rect x="330" y="0" width="310" height="90" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="354" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">🤖 Go Runner Daemons</text>
      <text x="354" y="64" font-family="'Inter', sans-serif" font-size="13" fill="#A1A1AA">15MB portable pull-model agents</text>

      <!-- Bento Item 3 -->
      <rect x="660" y="0" width="310" height="90" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="684" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">🔐 AES-256 GCM Vault</text>
      <text x="684" y="64" font-family="'Inter', sans-serif" font-size="13" fill="#A1A1AA">Encrypted multi-tenant secrets</text>
    </g>
  </g>
</svg>
